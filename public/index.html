<!doctype html>

    <style id="initial-load-style">
      html,
      body {
        background: #ffffff;
      }

      #initial-load-cover {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 18% 12%, rgba(194, 65, 12, 0.2), transparent 34%),
          linear-gradient(145deg, #0b1220 0%, #16243a 58%, #1f2937 100%);
        color: #ffffff;
      }

      .initial-load-card {
        display: grid;
        justify-items: center;
        gap: 16px;
        padding: 32px;
        text-align: center;
      }

      .initial-load-logo {
        font: 800 24px/1.1 Arial, sans-serif;
        letter-spacing: 0.12em;
      }

      .initial-load-logo span {
        color: #f97316;
      }

      .initial-load-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-top-color: #f97316;
        border-radius: 50%;
        animation: initial-load-spin 0.85s linear infinite;
      }

      .initial-load-label {
        margin: 0;
        color: rgba(255, 255, 255, 0.72);
        font: 500 14px/1.4 Arial, sans-serif;
      }

      @keyframes initial-load-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <noscript>
      <style>
        #initial-load-cover {
          display: none !important;
        }
      </style>
    </noscript>
